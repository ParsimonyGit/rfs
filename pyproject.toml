[project]
name = "rfs"
authors = [
    { name = "GreyCube Technologies", email = "admin@greycube.in"}
]
description = "Request for sample from supplier"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
# No third-party runtime dependencies. `requests` was pinned here at ~=2.28.2 but
# is never imported by this app; because frappe requires requests~=2.33.0, the pin
# actively downgraded the framework's own HTTP stack (requests 2.33 -> 2.28,
# urllib3 2.x -> 1.26) on every `pip install -e rfs`. Nothing to replace it with.
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"

[tool.bench.frappe-dependencies]
# Verified against frappe 16.31.0 / erpnext 16.32.1: install-app, migrate and the
# whole REST surface this app is consumed through work unchanged on v16. Kept
# open at the bottom so a v15 bench still installs it.
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"